<div class="dashboard-wrapper">
  <main class="main-content">

    <!-- Header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Active Projects</h1>
        <p class="page-sub">{{ countProjects }} project{{ countProjects !== 1 ? 's' : '' }} in your pipeline</p>
      </div>
      <button class="btn-add" routerLink="/home/createproject">
        <i class="bi bi-plus-lg"></i>
        <span>New Project</span>
      </button>
    </div>

    <!-- Loading -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="spinner-ring"></div>
      <p>Fetching your projects…</p>
    </div>

    <!-- Empty -->
    <div *ngIf="!isLoading && projects.length === 0" class="empty-state">
      <div class="empty-icon"><i class="bi bi-inbox"></i></div>
      <h4>No active projects</h4>
      <p>Start by creating your first project.</p>
      <button class="btn-add" routerLink="/home/createproject">
        <i class="bi bi-plus-lg"></i> Create Project
      </button>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" *ngIf="!isLoading && projects.length > 0">
      <div class="project-card"
           *ngFor="let p of projects; trackBy: trackByProjectId"
           [routerLink]="['/home/viewproject', p._id]">

        <!-- Top row -->
        <div class="card-top">
          <div class="proj-icon"><i class="bi bi-terminal"></i></div>
          <div class="proj-badge">
            <span class="pulse-dot"></span> Active
          </div>
        </div>

        <!-- Name & owner -->
        <div class="card-body">
          <h3 class="proj-name">{{ p.name }}</h3>
          <p class="proj-owner">
            <i class="bi bi-person-circle"></i>
            {{ p.owner?.name || p.clientName || 'Personal Project' }}
          </p>
        </div>

        <!-- Footer -->
        <div class="card-footer">
          <div class="rate-badge">
            <i class="bi bi-graph-up-arrow"></i>
            ${{ p.hourlyRate || 0 }}/h
          </div>
          <button class="btn-arrow"><i class="bi bi-arrow-right"></i></button>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination-wrap" *ngIf="totalPages > 1">
      <button class="pg-btn" [disabled]="currentPage === 1" (click)="onPageChange(currentPage - 1)">
        <i class="bi bi-chevron-left"></i>
      </button>
      <button class="pg-btn"
              *ngFor="let page of pages"
              [class.active]="page === currentPage"
              (click)="onPageChange(page)">
        {{ page }}
      </button>
      <button class="pg-btn" [disabled]="currentPage === totalPages" (click)="onPageChange(currentPage + 1)">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>

  </main>
</div>
